# Pipeline Settings

# Gemini — Cloud LLM for fast classification (processes ALL episodes)
gemini:
  model: "gemini-3.6-flash"  # Fast and cheap. Also: gemini-2.5-pro (better but slower)
  temperature: 0.3
  rpm_limit: 15  # Free tier: 15 RPM. Paid tier: set to 1000 for max speed

# Ollama — Local LLM fallback (if you prefer offline/free)
ollama:
  base_url: "http://localhost:11434"
  model: "llama3.2:3b"
  timeout: 120
  temperature: 0.3
  max_retries: 3

# NVIDIA API — Cloud LLM (deep analysis for important episodes only)
nvidia:
  base_url: "https://integrate.api.nvidia.com/v1"
  model: "meta/llama-3.1-70b-instruct"  # Powerful model for deep analysis
  timeout: 180
  temperature: 0.4
  max_tokens: 4096
  max_retries: 3

# YouTube Data API v3
# Free quota: 10,000 units/day. This pipeline uses ~2 units per 50 videos fetched.
# 500 videos = ~20 units. Well within free tier even for daily runs.
youtube:
  results_per_page: 50
  order: "date"  # date, viewCount, rating
  fetch_description: true
  fetch_duration: true

# Transcript
transcript:
  preferred_languages: ["en", "hi"]
  fallback_to_auto: true
  chunk_size: 5000  # chars per chunk for AI

# Processing
processing:
  batch_size: 5
  delay_between_requests: 2  # seconds between API calls
  skip_already_processed: true
  save_raw_transcripts: true

# Logging
logging:
  level: "INFO"
  file: "pipeline.log"
  max_size_mb: 10
